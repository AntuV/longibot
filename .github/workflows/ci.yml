name: Checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: longibot
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: longibot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U longibot -d longibot_test"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://longibot:ci-password@localhost:5432/longibot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run db:check
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:coverage
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            coverage/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BASE_URL: https://bot.example.com
      DATABASE_URL: postgresql://longibot:ci-password@postgres:5432/longibot
      POSTGRES_PASSWORD: ci-password
      POSTGRES_VOLUME_NAME: longibot-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: sh scripts/smoke-containers.sh
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [tests, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/antuv/longibot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
