name: longibot-dev
services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: longibot
      POSTGRES_PASSWORD: longibot-local
      POSTGRES_DB: longibot
    ports: ['127.0.0.1:5432:5432']
    volumes: [dev-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U longibot -d longibot']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  dev-postgres: {}
